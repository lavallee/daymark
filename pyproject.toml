[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "daymark-core"
version = "0.3.0"
description = "A task system for agents handling real life: deadlines, plans, recurrence, readiness and reminders"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Marc Lavallee"}]
dependencies = [
    "pydantic>=2.10,<3",
    "python-dateutil>=2.9,<3",
    "tzdata>=2025.2",
]
[project.optional-dependencies]
service = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
[project.scripts]
daymark = "daymark.cli:main"
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30", "build>=1"]
[tool.hatch.build.targets.wheel]
packages = ["src/daymark"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[tool.hatch.build.targets.sdist]
include = ["src/daymark", "tests", "README.md", "LICENSE", "CONTRIBUTING.md", "SECURITY.md", "CHANGELOG.md", "RELEASING.md", "pyproject.toml", "uv.lock"]
